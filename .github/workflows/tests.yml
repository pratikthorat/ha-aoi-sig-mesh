name: Tests

on:
  push:
  pull_request:

jobs:
  mesh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pytest cryptography ruff
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
