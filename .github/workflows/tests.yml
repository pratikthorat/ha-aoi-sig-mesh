name: Tests

on:
  push:
  pull_request:

jobs:
  mesh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pytest cryptography ruff pyyaml
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  ha:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: >-
          pip install homeassistant==2026.5.4
          pytest-homeassistant-custom-component==0.13.333
          aiousbwatcher==1.1.2 serialx==1.7.3 aioesphomeapi==44.24.1
      # Test the Bluetooth libraries this HA version really runs, not the newest ones pip finds.
      - run: pip install $(python tools/ci_ha_pins.py)
      - run: pip list | grep -iE "^(homeassistant|habluetooth|bleak|bleak-retry-connector) "
      - run: >-
          python -m pytest -c tests/components/aoi_sig_mesh/pytest.ini
          tests/components/aoi_sig_mesh -q -p no:cacheprovider
