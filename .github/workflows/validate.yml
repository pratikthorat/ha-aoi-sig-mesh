name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"

permissions:
  contents: read

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      # The HACS default list accepts no ignored checks. The brands check passes on the
      # icon in custom_components/aoi_sig_mesh/brand/.
      - uses: hacs/action@main
        with:
          category: integration
